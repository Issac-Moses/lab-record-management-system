# =============================================================================
# Nginx Production Config — Lab Management Portal
#
# Responsibilities:
#   1. Serve Vite static build (React SPA) from /usr/share/nginx/html
#   2. Reverse-proxy /api/* → backend Express container (port 7001)
#   3. Reverse-proxy /run   → backend Express container (code execution)
#   4. SPA fallback: unknown routes → index.html (client-side routing)
#   5. Gzip compression, security headers, long-lived asset caching
#
# The frontend container and backend container share the same Docker
# Compose network, so "backend" hostname resolves to the backend container.
# =============================================================================

server {
    listen       80;
    server_name  _;          # Accept any hostname (Coolify/Traefik handles HTTPS + domain)

    root  /usr/share/nginx/html;
    index index.html;

    # ─── Gzip Compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ─── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-XSS-Protection        "1; mode=block"                    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;

    # ─── Reverse Proxy: /api/* → Express backend ──────────────────────────────
    # All API routes (manual, gamification, admin, ai) are under /api/
    # Nginx forwards them to the backend container on port 7001.
    # Coolify's Traefik terminates HTTPS and sets X-Forwarded-* headers upstream.
    location /api/ {
        proxy_pass              http://backend:7001/api/;
        proxy_http_version      1.1;
        proxy_set_header        Host               $host;
        proxy_set_header        X-Real-IP          $remote_addr;
        proxy_set_header        X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto  $scheme;
        proxy_read_timeout      120s;
        proxy_connect_timeout   10s;
        proxy_send_timeout      120s;
        client_max_body_size    25m;   # Allow PDF/image uploads up to 25 MB
    }

    # ─── Reverse Proxy: /run → Express backend (code execution) ───────────────
    # The code runner endpoint lives at POST /run (not under /api/).
    # Extended timeouts because Docker image pulls can take >30s on first run.
    location /run {
        proxy_pass              http://backend:7001/run;
        proxy_http_version      1.1;
        proxy_set_header        Host               $host;
        proxy_set_header        X-Real-IP          $remote_addr;
        proxy_set_header        X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto  $scheme;
        proxy_read_timeout      180s;   # Give Docker 3 min to pull + run image
        proxy_connect_timeout   10s;
        proxy_send_timeout      180s;
        client_max_body_size    5m;
    }

    # ─── Static Asset Caching ─────────────────────────────────────────────────
    # Vite generates content-hashed filenames (e.g. index-Bx3a9k2f.js)
    # so assets can be cached indefinitely — changing code produces new filenames.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── SPA Fallback ─────────────────────────────────────────────────────────
    # React Router handles all navigation client-side.
    # Any URL that doesn't match a real file is served index.html
    # so the React app can take over routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
